# Catch-all: rechaza accesos por IP o con Host desconocido.
# El prefijo 00- lo carga primero en el glob de conf.d/*.conf

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Necesario para emitir certs de dominios que aun no tienen
    # su propio server block (lo usa init-ssl.sh)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
